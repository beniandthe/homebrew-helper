name: Production Smoke

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            url: https://homebrewhelper.expo.app/
            expected: Homebrew Helper
          - name: pricing
            url: https://homebrewhelper.expo.app/pricing
            expected: Current Pricing
            expected_secondary: $4.99
          - name: privacy
            url: https://homebrewhelper.expo.app/privacy
            expected: admin@homebrew-helper.com
          - name: terms
            url: https://homebrewhelper.expo.app/terms
            expected: admin@homebrew-helper.com

    steps:
      - name: Check ${{ matrix.name }}
        shell: bash
        env:
          URL: ${{ matrix.url }}
          EXPECTED: ${{ matrix.expected }}
          EXPECTED_SECONDARY: ${{ matrix.expected_secondary || '' }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          url = os.environ["URL"]
          expected = os.environ["EXPECTED"]
          expected_secondary = os.environ.get("EXPECTED_SECONDARY", "")
          retries = 5

          headers = {
              "User-Agent": "HomebrewHelper-Production-Smoke/1.0",
              "Accept": "text/html,application/xhtml+xml",
          }

          last_error = None

          for attempt in range(1, retries + 1):
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.getcode()
                      html = response.read().decode("utf-8", errors="replace")

                  if status >= 400:
                      raise RuntimeError(f"Unexpected HTTP status {status} for {url}")

                  normalized_html = " ".join(html.split())

                  if expected not in normalized_html:
                      raise RuntimeError(f"Expected text not found for {url}: {expected}")

                  if expected_secondary and expected_secondary not in normalized_html:
                      raise RuntimeError(
                          f"Expected secondary text not found for {url}: {expected_secondary}"
                      )

                  print(f"Smoke check passed for {url} (status {status})")
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/{retries} failed for {url}: {exc}", file=sys.stderr)
                  if attempt < retries:
                      time.sleep(attempt * 5)

          print(f"Production smoke failed for {url}: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY
